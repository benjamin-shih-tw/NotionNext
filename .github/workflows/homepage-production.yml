name: Verify current website deployment
on:
  push:
    branches: [main]
    paths:
      - 'pages/admin.js'
      - 'pages/api/admin/**'
      - 'middleware.ts'
      - 'lib/admin/**'
      - 'data/homepage.json'
      - 'scripts/admin-production-smoke.mjs'
      - '.github/workflows/homepage-production.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homepage-production
  cancel-in-progress: true
jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verify existing production homepage and protected editor
        run: node scripts/admin-production-smoke.mjs
