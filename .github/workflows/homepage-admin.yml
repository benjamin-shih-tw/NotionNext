name: Homepage admin verification
on:
  push:
    branches: [main, fix/current-site-homepage-admin]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homepage-admin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Verify admin authorization and GitHub publishing
        run: yarn test --runInBand __tests__/pages/api/admin/home.test.js
      - name: Build existing NotionNext website
        run: yarn build
        env:
          BUILD_PREFETCH_ENABLED: 'false'
      - name: Verify production HTTP routes
        run: node scripts/admin-http-smoke.mjs
