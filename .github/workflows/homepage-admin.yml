name: Homepage admin verification
on:
  push:
    branches: [main, fix/current-site-homepage-admin]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homepage-admin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Verify admin authorization and GitHub publishing
        run: yarn test --runInBand __tests__/pages/api/admin/home.test.js __tests__/themes/simple/NotebookHome.admin.test.js
      - name: Lint homepage editor changes
        run: yarn next lint --file pages/admin.js --file pages/api/admin/home.js --file middleware.ts --file lib/admin/auth.js --file lib/admin/homepage.js --file pages/index.js --file components/SEO.js --file themes/simple/components/NotebookHome.js
      - name: Build existing NotionNext website
        run: yarn build
        env:
          BUILD_PREFETCH_ENABLED: 'false'
      - name: Verify production HTTP routes
        run: node scripts/admin-http-smoke.mjs
